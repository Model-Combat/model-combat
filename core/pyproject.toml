[project]
name = "model-combat-v1"
version = "0.1.0"
description = "Python/FastAPI implementation of the Model Combat v1 judge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4,<4",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "psycopg[binary]>=3.2.0,<4",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.5.0,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0.35,<3",
  "uvicorn>=0.31.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]

[tool.uv]
package = true
